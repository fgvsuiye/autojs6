name: Auto Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/workflows/release.yml
      - .gitignore
      - project.json
      - README.md
      - '**/*.md'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get release metadata
        id: release
        run: |
          echo "tag_date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Extract latest changelog
        id: changelog_extractor
        run: |
          delimiter="$(openssl rand -hex 16)"
          {
            printf 'changelog_text<<%s\n' "$delimiter"
            awk '
              /^### V[0-9]/ {
                if (in_block) {
                  exit
                }
                in_block = 1
              }
              in_block {
                print
              }
            ' README.md
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Create project ZIP
        run: |
          git archive --format=zip --output="project_${{ steps.release.outputs.tag_date }}_${{ steps.release.outputs.sha }}.zip" HEAD -- . ':(exclude).github/**'
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.release.outputs.tag_date }}-${{ steps.release.outputs.sha }}
          name: Release ${{ steps.release.outputs.tag_date }}-${{ steps.release.outputs.sha }}
          body: |
            使用说明:
              下载项目 ZIP 文件，解压至工作目录后阅读 README.md 文件，了解项目使用方法和注意事项。
              工作目录默认为 /storage/emulated/0/脚本/
            ${{ steps.changelog_extractor.outputs.changelog_text }}
          files: |
            project_${{ steps.release.outputs.tag_date }}_${{ steps.release.outputs.sha }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}